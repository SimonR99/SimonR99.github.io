- name: Shepherd
  i18n: shepherd
  url : https://github.com/kapr-ai/shepherd.git
  img: /static/assets/img/projects/shepherd.png
  desc: A semantic mapping system for a mobile robot.
  stack: "Technology used : Habitat-Sim, Gym, Pytorch, HuggingFace, DB-SCAN, FastSAM, CLIP, BLIP"
  modalDescription : Shepherd is a semantic mapping system for a mobile robot. The system can identify objects, associate meanings to them, and allow users to query the map for later use. This gives robot the ability to understand their environment and navigate through it. In this project, I worked on multiple AI pipelines (CLIP, BLIP, FastSAM, DBSCAN, DAN, YOLO-World) and developed a modular architecture to ensure ease of use.
  tags: [AI, Robotics, Team Project]

- name: NTN simulator (Q-learning & PSO)
  i18n: optimization_ntn
  url : https://github.com/SimonR99/optimisationNTN
  img: /static/assets/img/projects/optimisation_ntn.png
  desc: Optimization of a non-terrestial network using multiple optimization algorithms.
  stack: "Technology used : Q-learning, PSO, Python, Genetic Algorithm, Differential Evolution, Qt"
  modalDescription : The project aims to optimize the energy consumption of a non-terrestial network using multiple optimization algorithms for edge computing (MAEC). The project is a simulator that allows to test the optimization algorithms and to compare their performance. The simulator handle both offline and online optimization. In this project, I developed a graphical interface, multiple greedy algorithms, a Q-learning algorithm, PSO, GA and DE.
  tags: [AI, SWE, Team Project]


